; Never advertise the runtime in response headers.
expose_php = Off

; Timestamps are never revalidated: the code cannot change inside an immutable image, so
; every stat() call would be wasted. This is exactly why the development image must NOT
; set it — there the files do change under a bind mount.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

memory_limit = 256M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M

; Errors go to the container log, never to the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

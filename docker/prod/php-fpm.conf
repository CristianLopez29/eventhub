[www]
; The container writes its logs to stdout/stderr; the orchestrator collects them.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

listen = 127.0.0.1:9000

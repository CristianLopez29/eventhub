# Production stack. Nothing here publishes a host port: a shared Traefik instance owns
# :80/:443 and reaches this app over the external `edge` network. Docker writes published
# ports straight into iptables ahead of ufw, so a published port is reachable from the
# internet even when the firewall reports it denied.
name: eventhub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      CONTAINER_ROLE: web
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - internal
    volumes:
      - jwt_keys:/app/config/jwt
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      # Router names are global across every compose project on the box, so this one is
      # namespaced to the app.
      traefik.enable: 'true'
      traefik.docker.network: edge
      traefik.http.routers.eventhub.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.eventhub.entrypoints: websecure
      traefik.http.routers.eventhub.tls: 'true'
      traefik.http.routers.eventhub.tls.certresolver: letsencrypt
      traefik.http.routers.eventhub.middlewares: eventhub-security@file
      traefik.http.services.eventhub.loadbalancer.server.port: '8080'

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      # Shares the image but never migrates, so it cannot race the web container.
      CONTAINER_ROLE: scheduler
    command: ['/app/docker/prod/scheduler.sh']
    depends_on:
      app:
        condition: service_started
    networks:
      - internal
    volumes:
      - jwt_keys:/app/config/jwt
    deploy:
      resources:
        limits:
          memory: 256M

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  edge:
    external: true
  internal:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  jwt_keys:
